[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:migrate]
command=/app/.venv/bin/python manage.py migrate --noinput
directory=/app
user=root
autostart=true
autorestart=false
startsecs=0
exitcodes=0
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
priority=1

[program:django]
# PLAT-5338: gthread, not the default sync worker.
#
# With `--workers 2` and sync workers, :8003 serves exactly 2 requests at a
# time, each able to hold its worker for the full `--timeout`. Two concurrent
# requests blocked on a slow upstream therefore stall EVERY other request on
# the port, including the kubelet's /api/health/ probe (3s readiness, 5s
# liveness) — which is how this service accumulated 14 liveness kills in 16h
# while sitting at ~10m CPU: the workers were blocked on a socket, not busy.
#
# gthread keeps a blocked request on a thread instead of the whole worker, so
# an I/O-bound upstream can no longer head-of-line-block a health check that
# does no I/O at all. 2 workers x 8 threads = 16 concurrent; DB pressure is
# bounded because CONN_MAX_AGE is unset (Django default 0), so connections are
# per-request rather than pinned per thread.
#
# --timeout 120 -> 60 so a wedged request is recycled inside the window a
# liveness probe would otherwise kill the whole pod in.
#
# Access/error logs go to stdout: they previously went to a file inside the
# container, so `kubectl logs` showed only the MCP server and this incident had
# no visible trace at all — the warning that fires on a failed Pulse proxy was
# being written somewhere nobody reads.
command=/app/.venv/bin/gunicorn --bind 0.0.0.0:8003 shizuha_admin.wsgi:application --workers 2 --worker-class gthread --threads 8 --timeout 60 --graceful-timeout 30 --access-logfile - --error-logfile -
directory=/app
user=root
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
environment=DJANGO_SETTINGS_MODULE="shizuha_admin.settings"
priority=2

[program:mcp-server]
command=/app/.venv/bin/python /app/mcp-server/admin_server.py --http-port 18103
directory=/app/mcp-server
user=root
autostart=true
autorestart=true
startsecs=3
startretries=5
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
environment=SHIZUHA_ADMIN_URL="http://localhost:8003",SHIZUHA_MCP_OAUTH_ENFORCE="true"
priority=10

[unix_http_server]
file=/var/run/supervisor.sock

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface
