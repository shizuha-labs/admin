# Shizuha Origin CI/CD — MULTI-ARCH build + deploy admin (ORIG-7 Plan A).
# Lives in the admin repo; triggers on its own pushes (synced GitHub->Origin every 5m).
# Builds admin for BOTH amd64 + arm64 via two in-cluster kaniko Jobs (arch-matched nodes),
# combines them into a multi-arch manifest list with crane, deploys the list, and verifies.
# Multi-arch = the image runs on any platform node (s1 amd64 OR gx10 arm64) per PLAT-718 —
# no single-arch regression / exec-format crashes. Auth = KUBE_CONFIG_B64 org secret
# (least-privilege origin-ci-deployer SA). No submodule checkout, no docker-in-DinD.
name: deploy-admin
on:
  workflow_dispatch: {}
  push:
    branches: [main, master]
    # Forgejo supports on.push.paths (allowlist form only). Frontend-only and
    # docs-only commits are shipped by deploy-frontend.yml, so this backend
    # pipeline rebuilds + reruns the suite only when a backend-relevant path
    # changes. Conservative by design: when unsure whether a path affects the
    # backend image/tests, INCLUDE it here (fail-safe = rebuild, never skip).
    paths:
      - '.forgejo/workflows/deploy.yml'
      - '.forgejo/scripts/**'
      - 'Dockerfile*'
      - '.dockerignore'
      - 'supervisord.conf'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'manage.py'
      - 'organizations/**'
      - 'shizuha_admin/**'
      - 'mcp-server/**'
      - 'scripts/**'
# Only the latest commit per branch builds; a newer push cancels an older in-flight run.
# (The GitHub->Origin pull-sync also collapses rapid commits to one run per cycle.)
concurrency:
  group: deploy-admin-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # PLAT-4200 / PLAT-1317: deploy-blocking authorization invariant gate.
  # The Admin service is the platform membership/RBAC authority, so a green
  # build must prove cross-org isolation before any image is produced.
  authz-test-gate:
    runs-on: ubuntu-latest
    container:
      image: registry.registry.svc.cluster.local:5000/origin-ci-helm@sha256:90f02d48d68c0ed690f9ddd8bcef1167490610362c19d429943931433ed7b194
    defaults:
      run:
        shell: bash
    steps:
      - name: Install kubectl + cluster access
        run: |
          set -euo pipefail
          # Pinned toolbox vendors the client; do not download it per job.
          kubectl version --client -o json | python3 -c 'import json,sys; assert json.load(sys.stdin)["clientVersion"]["gitVersion"].split("+")[0] == "v1.34.6"'
          helm version --short | grep -F 'v3.21.2'
          mkdir -p "$HOME/.kube"
          printf '%s' "${{ secrets.KUBE_CONFIG_B64 }}" | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"
      - name: Run Admin authz-invariant suite before deploy
        run: |
          set -euo pipefail
          SHORT="$(echo "${{ github.sha }}" | cut -c1-7)"
          JOB="ci-test-shizuha-admin-${SHORT}"
          kubectl delete job -n build "${JOB}" --ignore-not-found

          cat <<YAML | kubectl apply -f -
          apiVersion: batch/v1
          kind: Job
          metadata:
            name: ${JOB}
            namespace: build
            labels: { app: ci-test, service: shizuha-admin, shizuha.io/ci-gate: PLAT-4200, shizuha.io/orig-task: ORIG-7 }
          spec:
            backoffLimit: 0
            ttlSecondsAfterFinished: 300
            template:
              spec:
                restartPolicy: Never
                initContainers:
                  - name: git-clone
                    image: alpine/git:2.43.0
                    command: ["/bin/sh","-c"]
                    args:
                      - |
                        set -euo pipefail
                        SOURCE_URL="\${GIT_SOURCE_URL:-}"
                        SOURCE_SHA="\${GIT_SOURCE_SHA:-}"
                        [ -n "\${SOURCE_URL}" ] && [ "\${SOURCE_URL}" != "<no value>" ] || SOURCE_URL="http://forgejo-http.origin.svc.cluster.local/shizuha-labs/admin.git"
                        [ -n "\${SOURCE_SHA}" ] && [ "\${SOURCE_SHA}" != "<no value>" ] || SOURCE_SHA="${{ github.sha }}"
                        case "\${SOURCE_URL}" in
                          http://forgejo-http.origin.svc.cluster.local/*) AUTH_URL="http://x-token-auth:\${GIT_PASSWORD}@forgejo-http.origin.svc.cluster.local/\${SOURCE_URL#http://forgejo-http.origin.svc.cluster.local/}" ;;
                          https://github.com/*) AUTH_URL="https://x-token-auth:\${GIT_PASSWORD}@github.com/\${SOURCE_URL#https://github.com/}" ;;
                          *) AUTH_URL="\${SOURCE_URL}" ;;
                        esac
                        git init /workspace/src
                        cd /workspace/src
                        git remote add origin "\${AUTH_URL}"
                        git fetch --depth=1 origin "\${SOURCE_SHA}"
                        git checkout --detach FETCH_HEAD
                        test "\$(git rev-parse HEAD)" = "\${SOURCE_SHA}"
                    env:
                      - name: GIT_PASSWORD
                        valueFrom: { secretKeyRef: { name: forgejo-token, key: password } }
                      - name: GIT_SOURCE_URL
                        value: "${{ github.event.pull_request.head.repo.clone_url }}"
                      - name: GIT_SOURCE_SHA
                        value: "${{ github.event.pull_request.head.sha }}"
                    volumeMounts: [{ mountPath: /workspace, name: workspace }]
                containers:
                  - name: test
                    image: python:3.11-bookworm
                    command: ["/bin/bash","-lc"]
                    args:
                      - |
                        set -euo pipefail
                        export DEBIAN_FRONTEND=noninteractive
                        apt-get -o Acquire::http::Proxy=http://apt-cache.registry.svc.cluster.local:3142 update
                        apt-get -o Acquire::http::Proxy=http://apt-cache.registry.svc.cluster.local:3142 install -y --no-install-recommends postgresql redis-server build-essential libpq-dev
                        pg_ctlcluster 15 main start
                        su postgres -c "psql -c \"ALTER USER postgres PASSWORD 'postgres';\""
                        su postgres -c "createdb shizuha_admin_ci" || true
                        # HIVE-671: the admin app now uses a Redis CACHES
                        # backend (fail-closed nonce claim); the authz suite
                        # serializes memberships (get_display_name -> cache.get),
                        # so the gate must provide Redis like it does Postgres.
                        redis-server --daemonize yes
                        redis-cli ping
                        cd /workspace/src
                        python -m pip install --index-url http://pip-cache.registry.svc.cluster.local/simple --trusted-host pip-cache.registry.svc.cluster.local --upgrade pip
                        python -m pip install --index-url http://pip-cache.registry.svc.cluster.local/simple --trusted-host pip-cache.registry.svc.cluster.local uv==0.11.26
                        uv sync --locked --no-dev --no-install-project
                        export POSTGRES_HOST=127.0.0.1 POSTGRES_PORT=5432 POSTGRES_USER=postgres POSTGRES_PASSWORD=postgres POSTGRES_DB=shizuha_admin_ci
                        export DEBUG=0 SECRET_KEY=ci-secret JWT_SECRET_KEY=ci-secret
                        .venv/bin/python manage.py test \
                          organizations.test_revocation_transport \
                          organizations.test_explicit_runtime_credentials \
                          organizations.test_plat4200_authz_isolation \
                          organizations.test_plat4200_internal_ingress_guard \
                          organizations.test_plat4200_internal_service_auth \
                          organizations.test_hive671_agent_profile \
                          organizations.test_hive671_membership_revoke_pg \
                          organizations.test_hive671_dual_key_auth \
                          organizations.test_jit_elevated_access \
                          organizations.test_plat4927_member_services_listing \
                          organizations.test_admin_overview_contracts \
                          organizations.test_internal_project_memberships \
                          organizations.test_plat8136_membership_v2 \
                          organizations.test_organization_cache_policy \
                          organizations.test_company_os_seed_configuration \
                          --noinput
                        .venv/bin/python scripts/test_plat4779_ledger_dedup.py
                        (
                          cd mcp-server
                          SHIZUHA_ADMIN_URL=http://admin-ci.invalid \
                            ../.venv/bin/python -m unittest \
                              test_plat4927_org_service_member \
                              test_plat5096_su_set_user_services \
                              test_token_verifier
                        )
                    resources:
                      requests: { memory: 2Gi, cpu: "1" }
                      limits: { memory: 8Gi }
                    volumeMounts: [{ mountPath: /workspace, name: workspace }]
                volumes: [{ emptyDir: {}, name: workspace }]
          YAML

          DEADLINE=$(( $(date +%s) + 1800 ))
          while true; do
            COMPLETE="$(kubectl get job -n build "${JOB}" -o jsonpath='{.status.conditions[?(@.type=="Complete")].status}' 2>/dev/null || true)"
            FAILED="$(kubectl get job -n build "${JOB}" -o jsonpath='{.status.conditions[?(@.type=="Failed")].status}' 2>/dev/null || true)"
            [ "${COMPLETE}" = "True" ] && break
            if [ "${FAILED}" = "True" ]; then
              echo "::error::Admin authz-invariant test gate FAILED — suite output follows"
              kubectl logs -n build "job/${JOB}" --all-containers --tail=300 || true
              exit 1
            fi
            if [ "$(date +%s)" -ge "${DEADLINE}" ]; then
              echo "::error::Admin authz-invariant test gate timed out after 1800s"
              kubectl logs -n build "job/${JOB}" --all-containers --tail=300 || true
              exit 1
            fi
            sleep 10
          done
          kubectl logs -n build "job/${JOB}" --all-containers --tail=160 || true
  # Build+push the multi-arch image CONCURRENTLY with the authz gate. Only the
  # deploy job below gates the rollout on BOTH authz-test-gate AND build, so the
  # long kaniko build no longer waits serially behind the Django suite.
  build:
    runs-on: ubuntu-latest
    container:
      image: registry.registry.svc.cluster.local:5000/origin-ci-helm@sha256:90f02d48d68c0ed690f9ddd8bcef1167490610362c19d429943931433ed7b194
    defaults:
      run:
        shell: bash
    steps:
      - name: Install kubectl + cluster access
        run: |
          set -euo pipefail
          # Pinned toolbox vendors the client; do not download it per job.
          kubectl version --client -o json | python3 -c 'import json,sys; assert json.load(sys.stdin)["clientVersion"]["gitVersion"].split("+")[0] == "v1.34.6"'
          helm version --short | grep -F 'v3.21.2'
          mkdir -p "$HOME/.kube"
          printf '%s' "${{ secrets.KUBE_CONFIG_B64 }}" | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"
      - name: Multi-arch build + verify
        run: |
          set -euo pipefail
          SHORT="$(echo "${{ github.sha }}" | cut -c1-7)"
          TAG="admin-${SHORT}"
          REG="registry.registry.svc.cluster.local:5000"
          NPM_CONFIG_REGISTRY="${NPM_CONFIG_REGISTRY:-http://npm-cache.registry.svc.cluster.local:4873/}"
          PIP_INDEX_URL="${PIP_INDEX_URL:-http://pip-cache.registry.svc.cluster.local/simple/}"
          PIP_TRUSTED_HOST="${PIP_TRUSTED_HOST:-pip-cache.registry.svc.cluster.local}"
          echo "Multi-arch build shizuha-admin:${TAG} (amd64 + arm64)"

          # A workflow_dispatch retry reuses the same commit SHA, so all Job
          # names below are identical to the failed run. `kubectl apply` does
          # not reset a terminal Job: without cleanup, a transient node loss
          # makes every retry observe the old Failed condition and exit
          # immediately. The workflow concurrency group guarantees there is
          # only one build for this ref, so deleting these commit-scoped Jobs
          # is safe and makes retry semantics actually idempotent.
          kubectl delete job -n build \
            "ci-build-admin-${SHORT}-amd64" \
            "ci-build-admin-${SHORT}-arm64" \
            "ci-manifest-admin-${SHORT}" \
            "ci-verify-shizuha-admin-${SHORT}" \
            --ignore-not-found --wait=true

          render_build_job() {  # $1=arch
            local ARCH="$1"
            cat <<YAML
          apiVersion: batch/v1
          kind: Job
          metadata:
            name: ci-build-admin-${SHORT}-${ARCH}
            namespace: build
            labels: { app: ci-build, shizuha.io/orig-task: ORIG-7 }
          spec:
            backoffLimit: 0
            ttlSecondsAfterFinished: 300
            template:
              spec:
                restartPolicy: Never
                nodeSelector: { kubernetes.io/arch: ${ARCH} }
                tolerations:
                  - { key: node.shizuha/workstation, operator: Exists, effect: NoSchedule }
                  - { key: shizuha.com/inference-paused, operator: Exists, effect: NoSchedule }
                  # amd64 kaniko on i9-ws times out pushing to registry ClusterIP;
                  # s1 overlay works and carries operator=unschedulable. CI tolerates
                  # the operator-hold taint instead of removing it.
                  - { key: operator, operator: Equal, value: unschedulable, effect: NoSchedule }
                affinity:
                  nodeAffinity:
                    requiredDuringSchedulingIgnoredDuringExecution:
                      nodeSelectorTerms:
                      - matchExpressions:
                        - { key: node-role.kubernetes.io/control-plane, operator: DoesNotExist }
                        # ORIG-253: i9-ws is deliberately absent from network-probe
                        # while its pod-CIDR path to GB10 remains asymmetric. These
                        # builds stream large registry/cache responses across nodes,
                        # so do not re-admit it before that probe exclusion is removed.
                        - { key: kubernetes.io/hostname, operator: NotIn, values: [i9-ws] }
                initContainers:
                  - name: git-clone
                    image: alpine/git:2.43.0
                    command: ["/bin/sh","-c"]
                    args:
                      - |
                        set -e
                        git clone --depth=50 http://x-token-auth:\${GIT_PASSWORD}@forgejo-http.origin.svc.cluster.local/shizuha-labs/admin.git /workspace/src
                        cd /workspace/src && (git checkout ${{ github.sha }} 2>/dev/null || echo "sha not in shallow clone; building default HEAD")
                        if [ -f /workspace/src/Dockerfile ]; then
                          awk '''
                            /^FROM[[:space:]]/ {
                              print
                              print "ARG NPM_CONFIG_REGISTRY=http://npm-cache.registry.svc.cluster.local:4873/"
                              print "ARG PIP_INDEX_URL=http://pip-cache.registry.svc.cluster.local/simple/"
                              print "ARG PIP_TRUSTED_HOST=pip-cache.registry.svc.cluster.local"
                              print "ENV NPM_CONFIG_REGISTRY=${NPM_CONFIG_REGISTRY}"
                              print "ENV PIP_INDEX_URL=${PIP_INDEX_URL}"
                              print "ENV PIP_TRUSTED_HOST=${PIP_TRUSTED_HOST}"
                              next
                            }
                            { print }
                          ''' /workspace/src/Dockerfile > /workspace/src/Dockerfile.cache-wired
                          mv /workspace/src/Dockerfile.cache-wired /workspace/src/Dockerfile
                        fi
                    env:
                      - name: GIT_PASSWORD
                        valueFrom: { secretKeyRef: { name: forgejo-token, key: password } }
                    volumeMounts: [{ mountPath: /workspace, name: workspace }]
                containers:
                  - name: kaniko
                    image: gcr.io/kaniko-project/executor:v1.23.2
                    args:
                      - --context=dir:///workspace/src
                      - --dockerfile=/workspace/src/Dockerfile
                      - --destination=${REG}/shizuha-admin:${TAG}-${ARCH}
                      - --cleanup
                      - --insecure
                      - --skip-tls-verify
                      - --insecure-pull
                      - --registry-mirror=mirror-dockerhub.registry.svc.cluster.local:5000
                      # --registry-mirror only covers Docker Hub; the Dockerfile also pulls
                      # ghcr.io/astral-sh/uv (kaniko fetched it direct + flaked 2026-07-12).
                      # Map ghcr.io to the in-cluster pull-through proxy so it cannot flake.
                      - --registry-map=ghcr.io=mirror-ghcr.registry.svc.cluster.local:5000
                      - --build-arg=NPM_CONFIG_REGISTRY=http://npm-cache.registry.svc.cluster.local:4873/
                      - --build-arg=PIP_INDEX_URL=http://pip-cache.registry.svc.cluster.local/simple/
                      - --build-arg=PIP_TRUSTED_HOST=pip-cache.registry.svc.cluster.local
                      - --cache=true
                      - --cache-repo=${REG}/kaniko-cache/admin-deploy-${ARCH}
                      - --cache-copy-layers=true
                      - --cache-ttl=336h
                      - --compressed-caching=false
                    volumeMounts: [{ mountPath: /workspace, name: workspace }]
                volumes: [{ emptyDir: {}, name: workspace }]
          YAML
          }

          # Launch both arch builds in parallel
          BUILD_GUARD_CONFIGMAP="origin-ci-build-guard-650fec631781"
          BUILD_GUARD_SHA256="650fec631781edce0e4980f0fb07b12ab78b67b1faf780b214d12a40f9dddcf6"
          BUILD_GUARD="${RUNNER_TEMP:-/tmp}/origin-ci-build-guard.py"
          kubectl get "configmap/${BUILD_GUARD_CONFIGMAP}" -n origin \
            -o jsonpath='{.data.guard\.py}' >"$BUILD_GUARD"
          echo "${BUILD_GUARD_SHA256}  ${BUILD_GUARD}" | sha256sum -c -
          job_name_for_arch() {
            local ARCH="$1"
            render_build_job "$ARCH" | awk '$1 == "name:" { print $2; exit }'
          }
          AMD64_JOB="$(job_name_for_arch amd64)"
          ARM64_JOB="$(job_name_for_arch arm64)"
          test -n "$AMD64_JOB" -a -n "$ARM64_JOB"
          cleanup_build_pair() {
            python3 "$BUILD_GUARD" cleanup \
              --namespace build --job "$AMD64_JOB" --job "$ARM64_JOB"
          }
          cleanup_on_failure() {
            rc=$?
            if [ "$rc" -ne 0 ]; then cleanup_build_pair || true; fi
            exit "$rc"
          }
          trap cleanup_on_failure EXIT INT TERM
          python3 "$BUILD_GUARD" preflight --arch amd64 --arch arm64
          cleanup_build_pair
          render_build_job amd64 | kubectl apply -f -
          render_build_job arm64 | kubectl apply -f -
          python3 "$BUILD_GUARD" wait-pair --namespace build \
            --job "amd64=${AMD64_JOB}" --job "arm64=${ARM64_JOB}" \
            --timeout-seconds 1800
          trap - EXIT INT TERM

          # The shared guard already captured both terminal completion receipts.
          echo "Both arch builds done."

          # Combine into a multi-arch manifest list with crane
          cat <<YAML | kubectl apply -f -
          apiVersion: batch/v1
          kind: Job
          metadata:
            name: ci-manifest-admin-${SHORT}
            namespace: build
            labels: { app: ci-manifest, shizuha.io/orig-task: ORIG-7 }
          spec:
            backoffLimit: 0
            ttlSecondsAfterFinished: 300
            template:
              spec:
                restartPolicy: Never
                containers:
                  - name: crane
                    image: gcr.io/go-containerregistry/crane:latest
                    # Image entrypoint IS the crane binary (distroless, no shell) — pass args directly.
                    args:
                      - index
                      - append
                      - --insecure
                      - -t
                      - ${REG}/shizuha-admin:${TAG}
                      - -m
                      - ${REG}/shizuha-admin:${TAG}-amd64
                      - -m
                      - ${REG}/shizuha-admin:${TAG}-arm64
          YAML
          kubectl wait -n build --for=condition=complete "job/ci-manifest-admin-${SHORT}" --timeout=300s || {
            echo "::error::manifest combine failed"; kubectl logs -n build "job/ci-manifest-admin-${SHORT}" --tail=30 || true; exit 1; }

          # Deploy the multi-arch manifest list
          verify_manifest() {
            local REPO="$1"
            local IMAGE_TAG="$2"
            local JOB="ci-verify-${REPO}-${SHORT}"
            cat <<YAML | kubectl apply -f -
          apiVersion: batch/v1
          kind: Job
          metadata:
            name: ${JOB}
            namespace: build
            labels: { app: ci-verify, service: ${REPO} }
          spec:
            backoffLimit: 0
            ttlSecondsAfterFinished: 300
            template:
              spec:
                restartPolicy: Never
                containers:
                  - name: manifest-check
                    image: python:3.12-alpine
                    command: ["python", "-c"]
                    args:
                      - |
                        import json, urllib.request
                        url = "http://${REG}/v2/${REPO}/manifests/${IMAGE_TAG}"
                        accept = ",".join([
                            "application/vnd.oci.image.index.v1+json",
                            "application/vnd.docker.distribution.manifest.list.v2+json",
                        ])
                        req = urllib.request.Request(url, headers={"Accept": accept})
                        with urllib.request.urlopen(req, timeout=30) as resp:
                            manifest = json.load(resp)
                        platforms = {
                            f"{m.get('platform', {}).get('os')}/{m.get('platform', {}).get('architecture')}"
                            for m in manifest.get("manifests", [])
                        }
                        missing = {"linux/amd64", "linux/arm64"} - platforms
                        print(f"{url} platforms={sorted(platforms)}")
                        if missing:
                            raise SystemExit(f"missing required platform(s): {sorted(missing)}")
          YAML
            kubectl wait -n build --for=condition=complete "job/${JOB}" --timeout=120s || {
              echo "::error::manifest verification failed"
              kubectl logs -n build "job/${JOB}" --tail=80 || true
              exit 1
            }
            kubectl logs -n build "job/${JOB}" --tail=20 || true
          }
          verify_manifest "shizuha-admin" "${TAG}"

  # Rollout gate: depends on BOTH authz-test-gate AND build. Neither a red suite
  # nor a failed build can reach the cluster, but they now run in parallel
  # instead of build waiting behind the gate.
  deploy:
    needs: [authz-test-gate, build]
    runs-on: ubuntu-latest
    container:
      image: registry.registry.svc.cluster.local:5000/origin-ci-helm@sha256:90f02d48d68c0ed690f9ddd8bcef1167490610362c19d429943931433ed7b194
    defaults:
      run:
        shell: bash
    steps:
      - name: Install kubectl + cluster access
        run: |
          set -euo pipefail
          # Pinned toolbox vendors the client; do not download it per job.
          kubectl version --client -o json | python3 -c 'import json,sys; assert json.load(sys.stdin)["clientVersion"]["gitVersion"].split("+")[0] == "v1.34.6"'
          helm version --short | grep -F 'v3.21.2'
          mkdir -p "$HOME/.kube"
          printf '%s' "${{ secrets.KUBE_CONFIG_B64 }}" | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"
      - name: Deploy multi-arch image + verify
        run: |
          set -euo pipefail
          SHORT="$(echo "${{ github.sha }}" | cut -c1-7)"
          TAG="admin-${SHORT}"
          REG="registry.registry.svc.cluster.local:5000"
          PREV="$(kubectl get deploy -n shizuha shizuha-admin -o jsonpath='{.spec.template.spec.containers[?(@.name=="shizuha-admin")].image}' 2>/dev/null || true)"
          if [ -n "${PREV}" ]; then
            echo "Current image: ${PREV}"
            echo "Rollback command: kubectl set image -n shizuha deploy/shizuha-admin shizuha-admin=${PREV} && kubectl rollout status -n shizuha deploy/shizuha-admin"
          fi
          # Image-only rolls left the signed membership verifier without its
          # existing key even though the chart already declares this reference.
          # Require the provisioned key and converge image + credential binding
          # in one pod-template update. Never mint or print credential material.
          kubectl -n shizuha get secret hive-service-signing-key \
            -o go-template='{{if index .data "key"}}present{{end}}' | grep -qx present || {
              echo "::error::Hive membership signing key is not provisioned"
              exit 1
            }
          kubectl -n shizuha patch deployment shizuha-admin --type=strategic --patch "$(cat <<JSON
          {"spec":{"template":{"spec":{"containers":[{"name":"shizuha-admin","image":"localhost:30500/shizuha-admin:${TAG}","env":[{"name":"SHIZUHA_REVOCATION_STATUS_URL","value":"http://shizuha-id.shizuha.svc.cluster.local.:8001/api/oauth/revocation-status"},{"name":"HIVE_SERVICE_SIGNING_KEY","value":null,"valueFrom":{"secretKeyRef":{"name":"hive-service-signing-key","key":"key","optional":true}}}]}]}}}}
          JSON
          )"
          kubectl rollout status -n shizuha deploy/shizuha-admin --timeout=300s
          LIVE="$(kubectl get deploy -n shizuha shizuha-admin -o jsonpath='{.spec.template.spec.containers[0].image}')"
          echo "Live: ${LIVE}"; echo "${LIVE}" | grep -q "${TAG}" && echo "OK multi-arch ${TAG}" || { echo "::error::image mismatch"; exit 1; }
          SIGNING_REF="$(kubectl -n shizuha get deployment shizuha-admin -o jsonpath='{range .spec.template.spec.containers[?(@.name=="shizuha-admin")].env[?(@.name=="HIVE_SERVICE_SIGNING_KEY")]}{.valueFrom.secretKeyRef.name}{" "}{.valueFrom.secretKeyRef.key}{end}')"
          [ "$SIGNING_REF" = 'hive-service-signing-key key' ] || {
            echo "::error::Hive membership verifier credential reference did not converge"
            exit 1
          }
          echo "OK Hive membership verifier credential reference converged"

          # PLAT-5342: a rolled-out image does NOT mean the schema moved. A
          # migration failure used to be invisible (supervisord exitcodes=0,1 +
          # file logs). `migrate --check` exits non-zero when ANY migration is
          # unapplied, turning silent divergence into a red deploy.
          if ! kubectl exec -n shizuha deploy/shizuha-admin -c shizuha-admin -- \
                 /app/.venv/bin/python manage.py migrate --check --noinput; then
            echo "::error::unapplied migrations after deploy — schema did not converge"
            kubectl logs -n shizuha deploy/shizuha-admin -c shizuha-admin --tail=60 | grep -iE "migrat|error|traceback|Applying" | tail -40 || true
            exit 1
          fi
          echo "OK schema converged — no unapplied migrations"
